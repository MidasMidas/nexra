spring.application.name=nexra-console-backend
server.port=8080
nexra.skills.data-file=backend/src/main/resources/data/skills.json
spring.datasource.url=jdbc:h2:file:./backend/data/nexra-db;DB_CLOSE_ON_EXIT=FALSE;FILE_LOCK=NO
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
nexra.skill-sync.enabled=true
nexra.skill-sync.target-count=3000
nexra.skill-sync.initial-delay-ms=900000
nexra.skill-sync.fixed-delay-ms=43200000
